version: '3.8'

services:
  mongodb:
    image: mongo:7-jammy
    container_name: disciplineos-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - disciplineos-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: disciplineos-backend
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/disciplineos
      - JWT_SECRET=discipline_os_production_secret_key_2026_jwt
      - JWT_REFRESH_SECRET=discipline_os_production_refresh_key_2026
      - CLIENT_URL=http://localhost:3000
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    networks:
      - disciplineos-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: disciplineos-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - disciplineos-net

volumes:
  mongo_data:

networks:
  disciplineos-net:
    driver: bridge
